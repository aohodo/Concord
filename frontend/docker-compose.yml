services:
  concord-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    container_name: concord-backend
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen3.8-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-concord-local-only}
      REDIS_URL: redis://:${REDIS_PASSWORD:-concord-local-only}@redis:6379/0
      RETRIEVAL_INDEX_PATH: /app/data/retrieval
    volumes:
      - concord-backend-data:/app/data
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - concord-network

  redis:
    image: redis:7-alpine
    container_name: concord-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-concord-local-only}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - concord-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concord-frontend
    environment:
      PYTHON_API_URL: /api/python
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      concord-backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - concord-network

  nginx:
    image: nginx:1.27-alpine
    container_name: concord-gateway
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      concord-backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - concord-network

networks:
  concord-network:
    driver: bridge

volumes:
  redis-data:
  concord-backend-data:
