name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Test backend
        run: python -m pytest backend/tests -q
      - name: Test interaction evaluation protocol
        run: python -m pytest evaluation/v2_interaction/tests -q
      - name: Lint Python
        run: python -m ruff check backend evaluation/v2_interaction
      - name: Scan public tree
        run: python backend/evaluation/m8_productization/public_safety.py --root .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: backend/requirements.txt
